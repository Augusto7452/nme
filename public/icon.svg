<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer circular radar perimeter -->
  <circle cx="256" cy="256" r="210" stroke="#f59e0b" stroke-width="6" opacity="0.4" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="160" stroke="#38bdf8" stroke-width="3" opacity="0.3" />
  <circle cx="256" cy="256" r="110" stroke="#38bdf8" stroke-width="2" opacity="0.2" />

  <!-- Center Shield Icon -->
  <path d="M256 96 L376 148 V272 C376 348 324 412 256 432 C188 412 136 348 136 272 V148 Z" 
        fill="#0f172a" 
        stroke="url(#goldGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Geolocation / Beacon pulse -->
  <circle cx="256" cy="240" r="32" fill="url(#goldGrad)" />
  <circle cx="256" cy="240" r="16" fill="#ffffff" />
  <path d="M256 280 L256 340 M230 330 L256 345 L282 330" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Text Badge -->
  <text x="256" y="385" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="4">CMEP</text>
</svg>
